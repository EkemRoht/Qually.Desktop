name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Qually.Desktop.sln

      - name: Build
        run: msbuild Qually.Desktop.sln /p:Configuration=Release /p:Platform="Any CPU" /m /verbosity:minimal

      - name: Pack builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($p in 'AccountHolder', 'BotQually', 'QuallyFlash') {
            Compress-Archive -Path "$p/bin/Release/*" -DestinationPath "dist/$p.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Qually.Desktop-${{ github.sha }}
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
